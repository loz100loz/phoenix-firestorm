[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "firestorm-mcp-bridge"
version = "0.1.0"
description = "Stage 0 Firestorm LEAP to MCP proof-of-concept bridge"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "llsd==1.2.4",
    "mcp==2.2.0",
]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[project.scripts]
firestorm-mcp-bridge = "firestorm_mcp_bridge.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

